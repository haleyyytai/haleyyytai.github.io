title: Huilin Tai
description: Personal website of Huilin Tai, first-year PhD student in Computer Science at Rice University.
url: https://haleyyytai.github.io
baseurl: ""

# Posts live at /blog/<filename-slug>/
permalink: /blog/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - run.bat
  - agreement.txt
  - delete_all.txt
  - Huilin_Tai_cv.docx
  - README.md

# Posts with `writing: true` go on /blog/writing/ instead of /blog/.
# Optionally set `category:` to one of these keys for the filter buttons.
writing_categories:
  - key: research-notes
    label: Research & Notes
  - key: essays
    label: Personal Essays
  - key: books
    label: Books
